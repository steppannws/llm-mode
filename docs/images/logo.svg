<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024">
  <defs>
    <!-- graphite body, lit from above -->
    <linearGradient id="body" x1="0" y1="100" x2="0" y2="924" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#3b3b40"/>
      <stop offset=".5" stop-color="#232326"/>
      <stop offset="1" stop-color="#141416"/>
    </linearGradient>
    <linearGradient id="rim" x1="0" y1="100" x2="0" y2="924" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#fff" stop-opacity=".32"/>
      <stop offset=".25" stop-color="#fff" stop-opacity=".06"/>
      <stop offset="1" stop-color="#fff" stop-opacity=".03"/>
    </linearGradient>
    <!-- lit track -->
    <linearGradient id="track" x1="0" y1="392" x2="0" y2="632" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#ff7a2e"/>
      <stop offset="1" stop-color="#ff4d12"/>
    </linearGradient>
    <radialGradient id="bloom" cx="512" cy="560" r="360" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#ff5a1a" stop-opacity=".38"/>
      <stop offset="1" stop-color="#ff5a1a" stop-opacity="0"/>
    </radialGradient>
    <!-- aluminium knob -->
    <linearGradient id="knob" x1="0" y1="402" x2="0" y2="622" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#d9d9de"/>
    </linearGradient>
    <radialGradient id="sheen" cx="640" cy="440" r="120" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#fff" stop-opacity=".9"/>
      <stop offset="1" stop-color="#fff" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="bezel" x1="0" y1="383" x2="0" y2="641" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#000" stop-opacity=".6"/>
      <stop offset="1" stop-color="#fff" stop-opacity=".16"/>
    </linearGradient>
    <linearGradient id="knobShade" x1="0" y1="404" x2="0" y2="620" gradientUnits="userSpaceOnUse">
      <stop offset=".55" stop-color="#000" stop-opacity="0"/>
      <stop offset="1" stop-color="#000" stop-opacity=".1"/>
    </linearGradient>
    <filter id="inset" x="-10%" y="-20%" width="120%" height="140%">
      <feOffset dy="14" in="SourceAlpha" result="o"/>
      <feGaussianBlur in="o" stdDeviation="14" result="b"/>
      <feComposite in="SourceAlpha" in2="b" operator="out" result="s"/>
      <feFlood flood-color="#5a1500" flood-opacity=".55"/>
      <feComposite in2="s" operator="in" result="shadow"/>
      <feMerge><feMergeNode in="SourceGraphic"/><feMergeNode in="shadow"/></feMerge>
    </filter>
    <filter id="drop" x="-30%" y="-30%" width="160%" height="170%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="14"/>
      <feOffset dy="16"/>
      <feComponentTransfer><feFuncA type="linear" slope=".45"/></feComponentTransfer>
      <feMerge><feMergeNode/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <clipPath id="squircle"><rect x="100" y="100" width="824" height="824" rx="185"/></clipPath>
  </defs>

  <!-- body -->
  <rect x="100" y="100" width="824" height="824" rx="185" fill="url(#body)"/>
  <rect x="100" y="100" width="824" height="824" rx="185" fill="url(#bloom)" clip-path="url(#squircle)"/>
  <rect x="102" y="102" width="820" height="820" rx="183" fill="none" stroke="url(#rim)" stroke-width="4"/>

  <!-- recessed bezel around the track -->
  <rect x="204" y="384" width="616" height="256" rx="128" fill="#0e0e10"/>
  <rect x="203" y="383" width="618" height="258" rx="129" fill="none" stroke="url(#bezel)" stroke-width="3"/>

  <!-- track, on -->
  <rect x="212" y="392" width="600" height="240" rx="120" fill="url(#track)" filter="url(#inset)"/>

  <!-- knob -->
  <g filter="url(#drop)">
    <circle cx="692" cy="512" r="108" fill="url(#knob)"/>
  </g>
  <circle cx="692" cy="512" r="108" fill="url(#knobShade)"/>
  <circle cx="692" cy="512" r="108" fill="url(#sheen)"/>
  <circle cx="692" cy="512" r="107" fill="none" stroke="#000" stroke-opacity=".08" stroke-width="2"/>

  <!-- engraved prompt on the knob -->
  <g fill="none" stroke-linecap="round" stroke-linejoin="round" stroke-width="15">
    <path d="M647 480l34 32-34 32M700 548h44" stroke="#fff" stroke-opacity=".9" transform="translate(0 2)"/>
    <path d="M647 480l34 32-34 32M700 548h44" stroke="#3a3a40"/>
  </g>
</svg>
